name: HyperFrames visual preview

on:
  pull_request:
    paths:
      - "examples/hyperframes/http-request-cinematic/**"
      - ".github/workflows/hyperframes-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperframes-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-cinematic-spike:
    # Do not execute arbitrary HTML/JS supplied by untrusted fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Scaffold disposable HyperFrames project
        run: |
          npm exec --yes --package=hyperframes@0.9.20 -- \
            hyperframes init /tmp/sahne-cinematic-spike \
            --example blank --skip-skills --non-interactive
          cp examples/hyperframes/http-request-cinematic/index.html \
            /tmp/sahne-cinematic-spike/index.html

      - name: Verify runtime, layout, motion and contrast
        run: |
          npm exec --yes --package=hyperframes@0.9.20 -- \
            hyperframes check /tmp/sahne-cinematic-spike

      - name: Render 1080p30 visual preview
        run: |
          mkdir -p out
          npm exec --yes --package=hyperframes@0.9.20 -- \
            hyperframes render /tmp/sahne-cinematic-spike \
            --fps 30 --workers 2 --quality draft --strict \
            --output "$GITHUB_WORKSPACE/out/http-request-cinematic-v2.mp4"

      - name: Verify exported MP4 metadata
        run: |
          ffprobe -v error -show_entries \
            format=duration:stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 out/http-request-cinematic-v2.mp4
          python3 - <<'PY'
          import json, subprocess
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-of", "json",
              "-show_entries", "format=duration:stream=codec_name,width,height,r_frame_rate",
              "out/http-request-cinematic-v2.mp4",
          ], text=True))
          stream = next(s for s in probe["streams"] if s.get("codec_name") == "h264")
          assert (stream["width"], stream["height"], stream["r_frame_rate"]) == (1920, 1080, "30/1")
          assert abs(float(probe["format"]["duration"]) - 14.5) < 0.1
          PY

      - name: Build contact sheet
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i out/http-request-cinematic-v2.mp4 \
            -vf "fps=1/3,scale=640:-1,tile=3x2:padding=4:margin=4" \
            -frames:v 1 out/contact-sheet.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sahne-http-cinematic-v2
          path: out/
          retention-days: 14
          if-no-files-found: warn
