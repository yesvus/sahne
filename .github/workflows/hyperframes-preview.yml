name: HyperFrames bilingual SFX preview

on:
  pull_request:
    paths:
      - "examples/hyperframes/http-request-cinematic/**"
      - "examples/production/storyboard.sfx-only-*.sample.json"
      - "src/production/**"
      - ".github/workflows/hyperframes-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperframes-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-cinematic-spike:
    # HTML/JS templates execute in the browser: do not run PRs from untrusted forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install tools and Montserrat (not committed to the repo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-montserrat
          fc-cache -f
          fc-match Montserrat | head -n 1
          pnpm install --frozen-lockfile

      - name: Scaffold temporary HyperFrames project
        run: |
          npm exec --yes --package=hyperframes@0.9.20 -- \
            hyperframes init /tmp/sahne-cinematic-spike \
            --example blank --skip-skills --non-interactive
          cp examples/hyperframes/http-request-cinematic/index.html \
            /tmp/sahne-cinematic-spike/index.html

      - name: Check animation layout, type and contrast
        run: |
          npm exec --yes --package=hyperframes@0.9.20 -- \
            hyperframes check /tmp/sahne-cinematic-spike

      - name: Render localized silent video (no voice)
        run: |
          mkdir -p out
          for language in tr en; do
            npm exec --yes --package=hyperframes@0.9.20 -- \
              hyperframes render /tmp/sahne-cinematic-spike \
              --fps 30 --workers 2 --quality draft --strict \
              --variables-file "$GITHUB_WORKSPACE/examples/hyperframes/http-request-cinematic/$language.variables.json" \
              --output "$GITHUB_WORKSPACE/out/http-request-$language-visual.mp4"
          done

      - name: Generate synthetic, original SFX test samples (no speech)
        run: |
          mkdir -p out/test-catalog/synthetic-click-v1
          cp examples/production/sound-catalog/synthetic-click.asset.json out/test-catalog/
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=800:sample_rate=48000:duration=0.3" \
            -af "afade=t=out:st=0.05:d=0.25" \
            -c:a pcm_s16le out/test-catalog/synthetic-click-v1/click.wav

          for language in tr en; do
            pnpm exec tsx scripts/validate-storyboard.ts - \
              "examples/production/storyboard.sfx-only-$language.sample.json" \
              out/test-catalog
            pnpm exec tsx scripts/mix-audio.ts \
              examples/production \
              "examples/production/storyboard.sfx-only-$language.sample.json" \
              out/test-catalog "out/$language-sfx.wav"
            pnpm exec tsx scripts/assemble-video.ts \
              "examples/production/storyboard.sfx-only-$language.sample.json" \
              "out/http-request-$language-visual.mp4" "out/$language-sfx.wav" \
              "out/http-request-$language-sfx-preview.mp4"
          done

      - name: Verify H264/AAC 1080p30 exports and full 14.5-second duration
        run: |
          python3 - <<'PY'
          import json, subprocess
          for language in ('tr', 'en'):
              file = f'out/http-request-{language}-sfx-preview.mp4'
              data = json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-of','json','-show_entries',
                  'format=duration:stream=codec_type,codec_name,width,height,r_frame_rate',
                  file,
              ], text=True))
              v = next(s for s in data['streams'] if s['codec_type'] == 'video')
              a = next(s for s in data['streams'] if s['codec_type'] == 'audio')
              assert (v['width'],v['height'],v['codec_name'],v['r_frame_rate']) == (1920,1080,'h264','30/1')
              assert a['codec_name'] == 'aac'
              assert abs(float(data['format']['duration']) - 14.5) < 0.1
          PY

      - name: Verify test effects are audible but not clipped
        run: |
          python3 - <<'PY'
          import re, subprocess
          for language in ('tr', 'en'):
              file = f'out/http-request-{language}-sfx-preview.mp4'
              report = subprocess.run([
                  'ffmpeg', '-hide_banner', '-nostats', '-i', file,
                  '-af', 'volumedetect', '-vn', '-f', 'null', '-',
              ], capture_output=True, text=True, check=True)
              match = re.search(r'max_volume:\s*(-?[\d.]+)\s*dB', report.stderr)
              assert match, f'Cannot measure peak level for {language}'
              peak = float(match.group(1))
              print(f'{language} SFX-only peak: {peak:.1f} dBFS')
              # The fixture must be audible, while staying well clear of clipping.
              assert -38 <= peak <= -3, (language, peak)
          PY

      - name: Produce representative contact sheets
        run: |
          for language in tr en; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "out/http-request-$language-sfx-preview.mp4" \
              -vf "fps=1/3,scale=640:-1,tile=3x2:padding=4:margin=4" \
              -frames:v 1 "out/$language-contact-sheet.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sahne-http-localized-sfx-preview
          path: |
            out/*-sfx-preview.mp4
            out/*-contact-sheet.png
          retention-days: 14
          if-no-files-found: warn
