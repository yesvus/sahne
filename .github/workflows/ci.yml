name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Remotion version alignment
        run: pnpm exec remotion versions
      - name: Typecheck
        run: pnpm typecheck
      - name: Install FFmpeg for metadata and frame inspection
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Unit tests
        run: pnpm test
      - name: Prepare Chromium
        run: pnpm exec remotion browser ensure
      - name: Render thirty-frame H.264 smoke video
        shell: bash
        run: |
          mkdir -p out
          set -o pipefail
          pnpm render:smoke 2>&1 | tee out/render.log
      - name: Verify encoded video
        run: pnpm verify:smoke --stills out/smoke-stills
      - name: Render thirty frames crossing a timeline scene boundary
        shell: bash
        run: |
          mkdir -p out
          set -o pipefail
          pnpm render:timeline:smoke 2>&1 | tee out/timeline-render.log
      - name: Verify timeline output codec and metadata
        run: node scripts/verify-render.mjs out/timeline-smoke.mp4 --stills out/timeline-stills
      - name: Upload render inspection frames
        uses: actions/upload-artifact@v4
        with:
          name: sahne-render-inspection
          path: |
            out/smoke-stills/*.png
            out/timeline-stills/*.png
          if-no-files-found: error
          retention-days: 3
      - name: Upload debugging artifacts if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sahne-ci-debug
          path: out/
          if-no-files-found: ignore
          retention-days: 3
